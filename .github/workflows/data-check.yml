# Fails when CommunityDragon's live Set data no longer matches lib/data (usually after a patch).
# Fix by running `npm run data:update` locally and committing the regenerated file.
name: Game data check

on:
  schedule:
    - cron: '0 6 * * 3' # Wednesdays, after the usual Tuesday patch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm run data:check
